name: Product bug
description: Report a reproducible problem on repoagentkit.com
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, private repository contents, personal data, or unrelated logs.
  - type: input
    id: page
    attributes:
      label: Affected page
      description: Link to the public Repo Agent Kit page where the problem occurs.
      placeholder: https://repoagentkit.com/github-repo-audit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest sequence of steps that reproduces the problem with public or synthetic data.
      placeholder: |
        1. Open ...
        2. Enter ...
        3. Select ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 142 on macOS 15
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private repository content, and personal data from this report.
          required: true
        - label: I reproduced this on the current public site.
          required: true
